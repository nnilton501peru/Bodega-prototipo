<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodega Mauricio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f6f8;color:#1b1f24;font-size:18px;padding-bottom:96px}
header{background:#1b1f24;color:#fff;padding:14px 16px;font-size:22px;font-weight:700;position:sticky;top:0;z-index:5}
.buscar{padding:12px 12px 8px}
.buscar input{width:100%;height:52px;font-size:18px;padding:0 14px;border:2px solid #cfd6de;border-radius:12px;background:#fff;color:#1b1f24}
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 12px 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;min-height:48px;padding:10px 16px;font-size:17px;border:2px solid #cfd6de;border-radius:12px;background:#fff;color:#1b1f24;cursor:pointer}
.cats button.activa{background:#1b1f24;border-color:#1b1f24;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 12px}
.card{background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:2px solid transparent}
.card.enCarrito{border-color:#1f9d55}
.foto{height:120px;background:#eaf1f7;display:flex;align-items:center;justify-content:center;font-size:52px}
.foto img{width:100%;height:100%;object-fit:contain;background:#fff}
.info{padding:10px;display:flex;flex-direction:column;flex:1}
.nombre{font-size:17px;line-height:1.25;min-height:42px}
.precio{font-size:22px;font-weight:700;margin-top:4px}
.acciones{margin-top:auto;padding-top:8px}
.btn-add{width:100%;height:50px;border:none;border-radius:12px;background:#1f6fb8;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.ctrl{display:flex;align-items:center;justify-content:space-between;background:#1f9d55;color:#fff;border-radius:12px;height:50px}
.ctrl button{background:none;border:none;color:#fff;font-size:26px;width:50px;height:50px;cursor:pointer}
.ctrl span{font-size:18px;font-weight:700}
.agotado{background:#fde2e2;color:#9b1c1c;text-align:center;padding:14px 8px;border-radius:12px;font-weight:700;font-size:17px}
.aviso{padding:20px;text-align:center;font-size:17px;grid-column:1/-1;color:#333}
.barra{position:fixed;bottom:0;left:0;right:0;background:#1b1f24;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.barra .total{font-size:24px;font-weight:700}
.barra button{height:52px;padding:0 18px;border:none;border-radius:12px;background:#f97316;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.panel.abierto{display:flex}
.hoja{background:#fff;width:100%;max-height:85vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px}
.hoja h2{font-size:22px;margin-bottom:6px}
.linea{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e3e7ec}
.linea .datos{flex:1}
.linea .datos b{font-size:17px;display:block;margin-bottom:2px}
.linea .datos small{color:#555;font-size:15px}
.mini{width:44px;height:44px;border:none;border-radius:10px;background:#eef2f6;font-size:22px;cursor:pointer;color:#1b1f24}
.cant{font-size:19px;font-weight:700;min-width:28px;text-align:center}
.vacio{text-align:center;color:#555;padding:20px}
.totalPanel{font-size:22px;font-weight:700;margin-top:14px;text-align:right}
.wa{width:100%;height:56px;border:none;border-radius:14px;background:#25d366;color:#fff;font-size:19px;font-weight:700;margin-top:14px;cursor:pointer}
.cerrar{width:100%;height:48px;border:none;background:#eef2f6;border-radius:12px;font-size:17px;margin-top:10px;cursor:pointer;color:#1b1f24}
</style>
</head>
<body>

<header id="titulo"></header>

<div class="buscar"><input id="buscar" type="search" placeholder="Buscar producto"></div>
<div class="cats" id="cats"></div>
<main class="grid" id="grid"></main>

<div class="barra">
  <div>
    <div id="resumen">0 unidades</div>
    <div class="total" id="total">S/ 0.00</div>
  </div>
  <button id="abrir">Ver carrito</button>
</div>

<div class="panel" id="panel">
  <div class="hoja">
    <h2>Tu pedido</h2>
    <div id="lineas"></div>
    <p class="totalPanel" id="totalPanel"></p>
    <button class="wa" id="enviar">Pedir por WhatsApp</button>
    <button class="cerrar" id="cerrar">Seguir comprando</button>
  </div>
</div>

<script>
// ====== CONFIGURACIÓN ======
const CONFIG = {
  nombre: "Bodega Mauricio",
  whatsapp: "51959434743",
  // Pega aquí el link CSV de la hoja publicada (Archivo > Compartir > Publicar en la web > Hoja 1 > CSV)
  hojaCSV: "https://docs.google.com/spreadsheets/d/1oq0fFFptbyxSA1K9OD9G-3QrXvTI7rio8sZ1kje-MWA/gviz/tq?tqx=out:csv&gid=0"
};

const EMOJI = { "Bebidas":"🥤", "Snacks":"🍿", "Lácteos":"🥛", "Abarrotes":"🛒", "Golosinas":"🍬", "Limpieza":"🧼", "Cigarros":"🚬" };

let productos = [];
let categoria = "Todas";
const carrito = {};

function parsearCSV(texto){
  const filas = []; let fila = []; let campo = ""; let comillas = false;
  for (let i = 0; i < texto.length; i++){
    const c = texto[i];
    if (comillas){
      if (c === '"' && texto[i+1] === '"'){ campo += '"'; i++; }
      else if (c === '"') comillas = false;
      else campo += c;
    } else {
      if (c === '"') comillas = true;
      else if (c === ',') { fila.push(campo); campo = ""; }
      else if (c === '\n' || c === '\r'){
        if (c === '\r' && texto[i+1] === '\n') i++;
        fila.push(campo); filas.push(fila); fila = []; campo = "";
      }
      else campo += c;
    }
  }
  if (campo || fila.length){ fila.push(campo); filas.push(fila); }
  return filas;
}

function precioNumero(t){ return parseFloat(String(t).replace(/[^0-9.]/g, "")) || 0; }

async function cargarHoja(){
  const aviso = document.getElementById("grid");
  if (!CONFIG.hojaCSV || CONFIG.hojaCSV.startsWith("PEGAR")){
    aviso.innerHTML = '<p class="aviso">Falta pegar el link CSV de la hoja en CONFIG.</p>';
    return;
  }
  try{
    const r = await fetch(CONFIG.hojaCSV, { cache: "no-store" });
    const filas = parsearCSV(await r.text());
    const cab = filas[0].map(h => h.trim().toLowerCase());
    const idx = n => cab.indexOf(n);
    productos = filas.slice(1)
      .filter(f => f[idx("producto")])
      .map((f, i) => ({
        id: String(f[idx("id")] || (i + 1)),
        nombre: f[idx("producto")],
        categoria: f[idx("categoria")] || "Otros",
        precio: precioNumero(f[idx("precio")]),
        agotado: (f[idx("estado")] || "").trim().toLowerCase() === "agotado",
        foto: f[idx("imagen_url")] || ""
      }));
    pintarCategorias();
    pintarProductos();
  }catch(e){
    aviso.innerHTML = '<p class="aviso">No se pudo cargar la lista de productos. Revisa la conexión.</p>';
  }
}

function categorias(){
  return ["Todas", ...new Set(productos.map(p => p.categoria))];
}

function pintarCategorias(){
  const cont = document.getElementById("cats");
  cont.innerHTML = "";
  categorias().forEach(c => {
    const b = document.createElement("button");
    b.textContent = c;
    if (c === categoria) b.classList.add("activa");
    b.onclick = () => { categoria = c; pintarCategorias(); pintarProductos(); };
    cont.appendChild(b);
  });
}

function pintarProductos(){
  const grid = document.getElementById("grid");
  const q = document.getElementById("buscar").value.trim().toLowerCase();
  const lista = productos.filter(p =>
    (categoria === "Todas" || p.categoria === categoria) &&
    p.nombre.toLowerCase().includes(q)
  );
  grid.innerHTML = "";
  if (!lista.length){
    grid.innerHTML = '<p class="aviso">No hay productos con ese nombre.</p>';
    return;
  }
  lista.forEach(p => {
    const cant = carrito[p.id] || 0;
    const card = document.createElement("div");
    card.className = "card" + (cant > 0 ? " enCarrito" : "");

    const foto = document.createElement("div");
    foto.className = "foto";
    const emoji = EMOJI[p.categoria] || "📦";
    if (p.foto){
      const img = document.createElement("img");
      img.src = p.foto;
      img.alt = p.nombre;
      img.onerror = () => { img.remove(); foto.textContent = emoji; };
      foto.appendChild(img);
    } else {
      foto.textContent = emoji;
    }

    const info = document.createElement("div");
    info.className = "info";
    const nombre = document.createElement("div");
    nombre.className = "nombre";
    nombre.textContent = p.nombre;
    const precio = document.createElement("div");
    precio.className = "precio";
    precio.textContent = "S/ " + p.precio.toFixed(2);
    const acc = document.createElement("div");
    acc.className = "acciones";

    if (p.agotado){
      acc.innerHTML = '<div class="agotado">Agotado</div>';
    } else if (cant === 0){
      const b = document.createElement("button");
      b.className = "btn-add";
      b.textContent = "+ Agregar";
      b.onclick = () => cambiar(p.id, 1);
      acc.appendChild(b);
    } else {
      const c = document.createElement("div");
      c.className = "ctrl";
      const menos = document.createElement("button");
      menos.textContent = "−";
      menos.setAttribute("aria-label", "Quitar uno");
      menos.onclick = () => cambiar(p.id, -1);
      const n = document.createElement("span");
      n.textContent = "✓ " + cant;
      const mas = document.createElement("button");
      mas.textContent = "+";
      mas.setAttribute("aria-label", "Agregar uno");
      mas.onclick = () => cambiar(p.id, 1);
      c.append(menos, n, mas);
      acc.appendChild(c);
    }

    info.append(nombre, precio, acc);
    card.append(foto, info);
    grid.appendChild(card);
  });
}

function cambiar(id, delta){
  const n = (carrito[id] || 0) + delta;
  if (n <= 0) delete carrito[id]; else carrito[id] = n;
  pintarProductos();
  actualizarBarra();
  if (document.getElementById("panel").classList.contains("abierto")) pintarCarrito();
}

function totales(){
  let uds = 0, tot = 0;
  for (const id in carrito){
    const p = productos.find(x => x.id === id);
    if (p){ uds += carrito[id]; tot += carrito[id] * p.precio; }
  }
  return { uds, tot };
}

function actualizarBarra(){
  const { uds, tot } = totales();
  document.getElementById("resumen").textContent = uds + (uds === 1 ? " unidad" : " unidades");
  document.getElementById("total").textContent = "S/ " + tot.toFixed(2);
}

function pintarCarrito(){
  const cont = document.getElementById("lineas");
  cont.innerHTML = "";
  const ids = Object.keys(carrito);
  if (!ids.length){
    cont.innerHTML = '<p class="vacio">Todavía no agregas productos.</p>';
  }
  ids.forEach(id => {
    const p = productos.find(x => x.id === id);
    if (!p) return;
    const q = carrito[id];
    const div = document.createElement("div");
    div.className = "linea";
    const datos = document.createElement("div");
    datos.className = "datos";
    const b = document.createElement("b");
    b.textContent = p.nombre;
    const s = document.createElement("small");
    s.textContent = "S/ " + p.precio.toFixed(2) + " c/u · Subtotal S/ " + (p.precio * q).toFixed(2);
    datos.append(b, s);
    const menos = document.createElement("button");
    menos.className = "mini";
    menos.textContent = "−";
    menos.setAttribute("aria-label", "Quitar uno");
    menos.onclick = () => cambiar(id, -1);
    const cantEl = document.createElement("span");
    cantEl.className = "cant";
    cantEl.textContent = q;
    const mas = document.createElement("button");
    mas.className = "mini";
    mas.textContent = "+";
    mas.setAttribute("aria-label", "Agregar uno");
    mas.onclick = () => cambiar(id, 1);
    div.append(datos, menos, cantEl, mas);
    cont.appendChild(div);
  });
  document.getElementById("totalPanel").textContent = "Total: S/ " + totales().tot.toFixed(2);
}

function mensajeWA(){
  const lineas = [];
  for (const id in carrito){
    const p = productos.find(x => x.id === id);
    if (!p) continue;
    const q = carrito[id];
    lineas.push("- " + q + " x " + p.nombre + "\n   S/ " + p.precio.toFixed(2) + " c/u = S/ " + (p.precio * q).toFixed(2));
  }
  const { tot } = totales();
  return "Hola, quiero pedir en " + CONFIG.nombre + ":\n\n" + lineas.join("\n\n") +
         "\n\nTOTAL: S/ " + tot.toFixed(2) + "\n\n¿Me confirman, por favor?";
}

document.getElementById("enviar").onclick = () => {
  if (!Object.keys(carrito).length){ alert("Agrega productos primero."); return; }
  window.open("https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(mensajeWA()), "_blank");
};
document.getElementById("abrir").onclick = () => {
  pintarCarrito();
  document.getElementById("panel").classList.add("abierto");
};
document.getElementById("cerrar").onclick = () => {
  document.getElementById("panel").classList.remove("abierto");
};
document.getElementById("panel").onclick = (e) => {
  if (e.target.id === "panel") document.getElementById("panel").classList.remove("abierto");
};
document.getElementById("buscar").oninput = pintarProductos;
document.getElementById("titulo").textContent = CONFIG.nombre;

actualizarBarra();
cargarHoja();
</script>
</body>
</html>
