<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodega prototipo Mauricio V1.4</title>
<style>
:root { --verde:#1e7a4c; --verde-claro:#e8f5ec; --verde-linea:#c9e6d4; --fondo:#f6f3ec; --tarjeta:#ffffff; --texto:#1d1d1b; --gris:#5f5f5a; --wa:#128C4A; --rojo:#b03a2e; --linea:#e6e1d4; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); padding-bottom: 300px; }
header { background: var(--verde); color:#fff; padding: 18px 16px 14px; }
header h1 { margin:0; font-size: 26px; font-weight: 800; }
.version { font-size: 13px; font-weight: 600; background: rgba(255,255,255,.22); border-radius: 999px; padding: 2px 10px; vertical-align: middle; }
header p { margin: 4px 0 0; font-size: 16px; }
.buscar { padding: 14px 16px 4px; }
.buscar input { width:100%; padding: 14px; font-size: 17px; border: 2px solid #d9d4c7; border-radius: 12px; background:#fff; }
.grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; padding: 12px 16px; }
.card { position: relative; background: var(--tarjeta); border-radius: 16px; padding: 14px 10px 12px; text-align:center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.card.agotado { background: #efece6; }
.card .dot { position: absolute; top: 10px; left: 10px; }
.foto { position: relative; height: 64px; display:flex; align-items:center; justify-content:center; }
.foto .emo { font-size: 44px; line-height: 1; }
.foto img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 8px; }
.card .nombre { font-size: 17px; font-weight: 600; margin: 8px 0 4px; min-height: 42px; }
.card .precio { font-size: 26px; font-weight: 800; color: var(--verde); }
.card .cu { font-size: 14px; color: var(--gris); }
.card.agotado .precio { color: var(--gris); text-decoration: line-through; }
.sello { display:inline-block; margin-top: 10px; background: var(--rojo); color:#fff; font-weight:700; font-size: 15px; padding: 6px 14px; border-radius: 999px; }
.dot { display:inline-block; width:14px; height:14px; border-radius:50%; flex-shrink:0; }
.controles { display:flex; justify-content:center; align-items:center; gap: 14px; margin-top: 10px; min-height: 44px; }
.redondo { width:44px; height:44px; border-radius:50%; border:0; font-size:24px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0; }
.btn-menos { background:#efe9dc; color:var(--texto); }
.btn-mas { background:var(--verde); color:#fff; }
.cantidad { font-size: 22px; font-weight: 800; min-width: 28px; text-align:center; }
.panel { position: fixed; left:0; right:0; bottom:0; background: var(--verde-claro); box-shadow: 0 -4px 14px rgba(0,0,0,.14); border-radius: 18px 18px 0 0; padding: 12px 14px 14px; z-index: 5; }
.panel-cab { display:flex; justify-content:space-between; align-items:center; gap: 8px; }
.panel-cab h2 { margin:0; font-size: 20px; font-weight: 800; }
.panel-der { display:flex; align-items:center; gap: 8px; }
.info { font-size: 15px; color: var(--gris); }
.vaciar { background: transparent; border: 0; color: var(--gris); font-size: 15px; text-decoration: underline; cursor: pointer; padding: 4px; }
.aviso { display:none; background:#fff4d6; color:#5c4300; border-radius: 10px; padding: 8px 10px; font-size: 15px; margin-top: 8px; }
.aviso.visible { display:block; }
.panel-lista { max-height: 32vh; overflow-y: auto; margin-top: 8px; }
.item { background:#fff; border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; }
.item-fila { display:flex; justify-content:space-between; align-items:flex-start; gap: 8px; }
.item-izq { display:flex; gap: 8px; align-items:flex-start; }
.item-izq .dot { margin-top: 5px; }
.item-nombre { font-size: 16px; color: var(--texto); }
.item-cu { font-size: 14px; color: var(--gris); }
.item-sub { font-size: 22px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
.item-controles { display:flex; justify-content:space-between; align-items:center; margin-top: 6px; padding-left: 22px; }
.item-cant { display:flex; align-items:center; gap: 10px; }
.quitar { background: transparent; border: 0; color: var(--rojo); font-size: 15px; font-weight: 700; cursor:pointer; padding: 6px; }
.vacio { text-align:center; color: var(--gris); font-size: 16px; padding: 14px 8px; }
.panel-pie { border-top: 1px solid var(--verde-linea); margin-top: 8px; padding-top: 10px; }
.fila-total { display:flex; justify-content:space-between; align-items:baseline; }
.etiqueta { font-size: 16px; color: var(--gris); }
.total { font-size: 34px; font-weight: 800; line-height: 1.1; }
.btn-pedir { width:100%; margin-top: 8px; background: var(--wa); color:#fff; border:0; border-radius: 14px; padding: 15px; font-size: 19px; font-weight: 700; cursor:pointer; }
.btn-pedir:disabled { background:#b9bdb5; cursor: default; }
.mensaje { text-align:center; padding: 48px 20px; font-size: 18px; color: var(--gris); line-height: 1.5; }
.mensaje button { margin-top: 14px; padding: 12px 20px; font-size: 17px; border-radius: 12px; border:0; background: var(--verde); color:#fff; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Bodega prototipo Mauricio <span class="version">V1.4</span></h1>
  <p>Escoge tus productos y mira tu pedido abajo</p>
</header>
<div class="buscar"><input id="buscar" type="search" placeholder="Buscar producto" aria-label="Buscar producto"></div>
<div id="contenido"><div class="mensaje">Cargando productos…</div></div>

<div class="panel" id="panel">
  <div class="panel-cab">
    <h2>Tu pedido</h2>
    <div class="panel-der">
      <span class="info" id="info">Vacío</span>
      <button class="vaciar" id="vaciar">Vaciar</button>
    </div>
  </div>
  <div class="aviso" id="aviso" aria-live="polite"></div>
  <div class="panel-lista" id="lista-pedido"></div>
  <div class="panel-pie">
    <div class="fila-total">
      <span class="etiqueta">Total</span>
      <span class="total" id="total" aria-live="polite">S/ 0.00</span>
    </div>
    <button class="btn-pedir" id="pedir" disabled>Pedir por WhatsApp</button>
  </div>
</div>

<script>
// --- inicio funciones puras
const HOJA_ID = '1zUEvUneykIT7dbi2pO5AZwpBevyEJ_7WFc4-7VE6mJc';
const WHATSAPP = '51959434743'; // número del celular vendedor (prueba), con 51 y sin +
const URL_HOJA = 'https://docs.google.com/spreadsheets/d/' + HOJA_ID + '/gviz/tq?tqx=out:csv';
const ANCHO_TICKET = 22;
const PALETA = ['#D85A30', '#1D9E75', '#7F77DD', '#BA7517', '#378ADD', '#D4537E', '#639922', '#E24B4A'];
const COLORES_FIJOS = [['gaseosa', '#D85A30'], ['arroz', '#1D9E75'], ['leche', '#7F77DD']];
const EMOJIS = [
  ['gaseosa', '🥤'], ['agua', '💧'], ['piqueo', '🍿'], ['leche', '🥛'], ['panet', '🍞'],
  ['afeitad', '🪒'], ['arroz', '🍚'], ['azucar', '🧂'], ['aceite', '🫒'], ['fideo', '🍝'],
  ['huevo', '🥚'], ['galleta', '🍪'], ['atun', '🐟'], ['detergente', '🧴'], ['caramelo', '🍬'],
  ['papel', '🧻'], ['chocolate', '🍫']
];
const CLAVE_ENVIO = 'bodega-ultimo-envio';
const CLAVE_CARRITO = 'bodega-carrito';

function normalizar(t) {
  return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
}

function escapar(t) {
  return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseCSV(texto) {
  texto = texto.replace(/^\uFEFF/, '');
  const filas = [];
  let fila = [], campo = '', dentro = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (dentro) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') dentro = false;
      else campo += c;
    } else if (c === '"') {
      dentro = true;
    } else if (c === ',') {
      fila.push(campo); campo = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto[i + 1] === '\n') i++;
      fila.push(campo); filas.push(fila); fila = []; campo = '';
    } else {
      campo += c;
    }
  }
  if (campo !== '' || fila.length) { fila.push(campo); filas.push(fila); }
  return filas.filter(f => f.some(x => x.trim() !== ''));
}

function leerProductos(texto) {
  const filas = parseCSV(texto);
  if (filas.length < 2) return [];
  const cab = filas[0].map(normalizar);
  const iNom = cab.indexOf('producto');
  const iPre = cab.indexOf('precio');
  const iAgo = cab.indexOf('agotado');
  const iFot = cab.indexOf('foto');
  if (iNom < 0 || iPre < 0) throw new Error('Faltan las columnas Producto o Precio');
  return filas.slice(1).map(f => ({
    nombre: (f[iNom] || '').trim(),
    precio: parseFloat(String(f[iPre] || '').replace(/[^0-9.,]/g, '').replace(',', '.')) || 0,
    agotado: iAgo >= 0 && normalizar(f[iAgo] || '') === 'si',
    foto: iFot >= 0 ? (f[iFot] || '').trim() : ''
  })).filter(p => p.nombre);
}

function colorPara(nombre) {
  const n = normalizar(nombre);
  const fijo = COLORES_FIJOS.find(([clave]) => n.includes(clave));
  if (fijo) return fijo[1];
  let h = 0;
  for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return PALETA[h % PALETA.length];
}

function emojiPara(nombre) {
  const n = normalizar(nombre);
  const h = EMOJIS.find(([clave]) => n.includes(clave));
  return h ? h[1] : '🛒';
}

function soles(n) {
  return 'S/ ' + n.toFixed(2);
}

// Parte un texto en líneas de como máximo "ancho" caracteres.
// La primera línea usa todo el ancho; las siguientes llevan dos espacios de sangría.
function envolver(texto, ancho) {
  const palabras = texto.split(' ');
  const lineas = [];
  let actual = '';
  palabras.forEach(pal => {
    const max = lineas.length === 0 ? ancho : ancho - 2;
    const candidato = actual ? actual + ' ' + pal : pal;
    if (actual && candidato.length > max) {
      lineas.push(actual);
      actual = pal;
    } else {
      actual = candidato;
    }
  });
  if (actual) lineas.push(actual);
  return lineas.map((l, i) => (i === 0 ? l : '  ' + l));
}

function armarMensaje(items) {
  const total = items.reduce((s, p) => s + p.precio * p.cantidad, 0);
  const lineas = ['TOTAL: ' + soles(total), '-'.repeat(ANCHO_TICKET)];
  items.forEach((p, idx) => {
    if (idx > 0) lineas.push('');
    envolver('• ' + p.cantidad + ' x ' + p.nombre, ANCHO_TICKET).forEach(l => lineas.push(l));
    lineas.push('  ' + soles(p.precio) + ' c/u');
    lineas.push('  Subtotal: ' + soles(p.precio * p.cantidad));
  });
  return '```' + lineas.join('\n') + '```';
}

function formatearHora(iso) {
  try {
    return new Date(iso).toLocaleTimeString('es-PE', { hour: 'numeric', minute: '2-digit', hour12: true });
  } catch (e) {
    return new Date(iso).toLocaleTimeString();
  }
}
// --- fin funciones puras

function leerEnvio() {
  try { return JSON.parse(localStorage.getItem(CLAVE_ENVIO) || 'null'); } catch (e) { return null; }
}

function guardarEnvio(firma) {
  try { localStorage.setItem(CLAVE_ENVIO, JSON.stringify({ firma: firma, hora: new Date().toISOString() })); } catch (e) {}
}

// El carrito se guarda por nombre de producto, así sigue ahí si cierran Chrome sin querer.
function guardarCarrito() {
  try {
    const datos = {};
    Object.keys(carrito).forEach(k => { datos[productos[k].nombre] = carrito[k]; });
    localStorage.setItem(CLAVE_CARRITO, JSON.stringify(datos));
  } catch (e) {}
}

function restaurarCarrito() {
  try {
    const datos = JSON.parse(localStorage.getItem(CLAVE_CARRITO) || '{}');
    productos.forEach((p, i) => {
      if (!p.agotado && datos[p.nombre] > 0) carrito[i] = datos[p.nombre];
    });
  } catch (e) {}
}

let productos = [];
const carrito = {};

function pedidoActual() {
  return Object.keys(carrito).map(k => Object.assign({}, productos[k], { cantidad: carrito[k], indice: Number(k) }));
}

function fotoHTML(p) {
  const emo = '<span class="emo" aria-hidden="true">' + emojiPara(p.nombre) + '</span>';
  if (!p.foto) return '<div class="foto">' + emo + '</div>';
  return '<div class="foto">' + emo +
    '<img src="' + escapar(encodeURI(p.foto)) + '" alt="' + escapar(p.nombre) + '" loading="lazy" onerror="this.style.display=\'none\'">' +
    '</div>';
}

function tarjeta(p, i) {
  const q = carrito[i] || 0;
  const dot = '<span class="dot" style="background:' + colorPara(p.nombre) + '" aria-hidden="true"></span>';
  const foto = fotoHTML(p);
  const nombre = '<div class="nombre">' + escapar(p.nombre) + '</div>';
  const precio = '<div><span class="precio">' + soles(p.precio) + '</span> <span class="cu">c/u</span></div>';
  if (p.agotado) {
    return '<div class="card agotado">' + dot + foto + nombre + precio + '<span class="sello">Agotado</span></div>';
  }
  let controles;
  if (q === 0) {
    controles = '<div class="controles"><button class="redondo btn-mas" aria-label="Agregar uno" onclick="cambiar(' + i + ', 1)">+</button></div>';
  } else {
    controles = '<div class="controles">' +
      '<button class="redondo btn-menos" aria-label="Quitar uno" onclick="cambiar(' + i + ', -1)">−</button>' +
      '<span class="cantidad">' + q + '</span>' +
      '<button class="redondo btn-mas" aria-label="Agregar uno" onclick="cambiar(' + i + ', 1)">+</button>' +
      '</div>';
  }
  return '<div class="card">' + dot + foto + nombre + precio + controles + '</div>';
}

function renderGrid() {
  if (!productos.length) return;
  const busq = normalizar(document.getElementById('buscar').value);
  const visibles = productos.map((p, i) => ({ p, i })).filter(({ p }) => normalizar(p.nombre).includes(busq));
  document.getElementById('contenido').innerHTML = visibles.length
    ? '<div class="grid">' + visibles.map(({ p, i }) => tarjeta(p, i)).join('') + '</div>'
    : '<div class="mensaje">No encontramos ese producto.</div>';
}

function itemHTML(p) {
  const i = p.indice;
  return '<div class="item">' +
    '<div class="item-fila">' +
      '<div class="item-izq">' +
        '<span class="dot" style="background:' + colorPara(p.nombre) + '" aria-hidden="true"></span>' +
        '<div><div class="item-nombre">' + escapar(p.nombre) + '</div>' +
        '<div class="item-cu">' + soles(p.precio) + ' c/u</div></div>' +
      '</div>' +
      '<div class="item-sub">' + soles(p.precio * p.cantidad) + '</div>' +
    '</div>' +
    '<div class="item-controles">' +
      '<div class="item-cant">' +
        '<button class="redondo btn-menos" aria-label="Quitar uno" onclick="cambiar(' + i + ', -1)">−</button>' +
        '<span class="cantidad">' + p.cantidad + '</span>' +
        '<button class="redondo btn-mas" aria-label="Agregar uno" onclick="cambiar(' + i + ', 1)">+</button>' +
      '</div>' +
      '<button class="quitar" onclick="quitar(' + i + ')"><span aria-hidden="true">🗑</span> Quitar</button>' +
    '</div>' +
  '</div>';
}

function renderPanel() {
  const items = pedidoActual();
  const total = items.reduce((s, p) => s + p.precio * p.cantidad, 0);
  document.getElementById('info').textContent = items.length
    ? items.length + (items.length === 1 ? ' producto' : ' productos')
    : 'Vacío';
  document.getElementById('lista-pedido').innerHTML = items.length
    ? items.map(itemHTML).join('')
    : '<div class="vacio">Toca + en un producto para agregarlo.</div>';
  document.getElementById('total').textContent = soles(total);
  document.getElementById('vaciar').style.display = items.length ? 'inline' : 'none';

  const envio = leerEnvio();
  const firma = items.length ? armarMensaje(items) : '';
  const repetido = !!(envio && firma && envio.firma === firma);
  const aviso = document.getElementById('aviso');
  aviso.classList.toggle('visible', repetido);
  aviso.textContent = repetido ? 'Ya enviaste este mismo pedido a las ' + formatearHora(envio.hora) : '';

  const boton = document.getElementById('pedir');
  boton.disabled = items.length === 0;
  boton.textContent = repetido ? 'Pedir otra vez' : 'Pedir por WhatsApp';
}

function ajustarEspacio() {
  const panel = document.getElementById('panel');
  document.body.style.paddingBottom = (panel.offsetHeight + 12) + 'px';
}

function render() {
  if (productos.length) guardarCarrito();
  renderGrid();
  renderPanel();
  ajustarEspacio();
}

function cambiar(i, d) {
  const nueva = Math.max(0, (carrito[i] || 0) + d);
  if (nueva) carrito[i] = nueva; else delete carrito[i];
  render();
}

function quitar(i) {
  delete carrito[i];
  render();
}

function vaciar() {
  if (!Object.keys(carrito).length) return;
  if (!confirm('¿Vaciar todo el pedido?')) return;
  Object.keys(carrito).forEach(k => delete carrito[k]);
  render();
}

function enviarPedido() {
  const items = pedidoActual();
  if (!items.length) return;
  if (WHATSAPP.indexOf('X') >= 0) {
    alert('Falta poner el número de WhatsApp en el código.');
    return;
  }
  const mensaje = armarMensaje(items);
  guardarEnvio(mensaje);
  window.location.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(mensaje);
}

document.getElementById('pedir').addEventListener('click', enviarPedido);
document.getElementById('vaciar').addEventListener('click', vaciar);
document.getElementById('buscar').addEventListener('input', renderGrid);
window.addEventListener('resize', ajustarEspacio);

async function cargar() {
  const cont = document.getElementById('contenido');
  cont.innerHTML = '<div class="mensaje">Cargando productos…</div>';
  try {
    const r = await fetch(URL_HOJA);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    productos = leerProductos(await r.text());
    if (!productos.length) throw new Error('Hoja vacía');
    restaurarCarrito();
    render();
  } catch (e) {
    cont.innerHTML = '<div class="mensaje">No pudimos cargar los productos.<br>Revisa tu internet y vuelve a intentar.<br><button onclick="cargar()">Reintentar</button></div>';
  }
}

render();
cargar();
</script>
</body>
</html>
